<template>
  <style>
    #root { position: absolute; inset: 0; }
  </style>
  <!-- s03 对撞指针（LeetCode 167）：两端出发 → 和太大排除最大的、右指针左移 → 和太小排除最小的、左指针右移 → 每步排除一个，直到命中 -->
  <div id="root" data-composition-id="s03" data-width="1920" data-height="1080">
    <div id="s03-stage" style="position: absolute; inset: 0"></div>
  </div>
  <script>
    (function () {
      const { B, dur: DUR } = BEATS.s03;
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const L = LL(document.getElementById("s03-stage"), tl, DUR);
      const X = (i) => 960 + (i - 2.5) * 146;       // 六个格子相连，边框重叠 4 px

      L.header("手法 1", "对撞指针：每步排除一个数");
      const src = L.src("LeetCode 167 · target = 10", B[0] + 0.6);
      const VAL = [1, 3, 4, 6, 8, 11], Y = 300;
      const N = VAL.map((v, i) => L.node(v, X(i), Y));
      const out = (i, t) => N[i].fill("grayL", t).border("gray", t).dim(0.5, t + 0.01, 0.4);

      // —— 第 1 句：逐对尝试 ——
      N.forEach((n, i) => n.show(0.02 + i * 0.08));
      [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3]].forEach((pr, k) => {
        const t = B[0] + 3.9 + k * 0.5;
        pr.forEach((i) => N[i].fill("blueL", t, 0.12).fill("white", t + 0.38, 0.12));
      });

      // —— 第 2 句：两端出发 ——
      const l = L.tag("l", "blue", N[0]).show(B[1] + 2.6);
      const r = L.tag("r", "hot", N[5]).show(B[1] + 4.4);
      const sum = L.swap(600);
      sum.set("1 + 11 = 12", B[1] + 5.4);

      // —— 第 3 句：12 > 10，排除 11 ——
      const code = L.code(["if s > target: r -= 1", "elif s < target: l += 1"], { y: 720, w: 640 });
      sum.set('1 + 11 = 12 <span class="acc-o">&gt; 10</span>', B[2] + 1.2);
      code.show(B[2] + 6.6).line([0, 1], B[2] + 6.7).hl(0, B[2] + 7.2);
      out(5, B[2] + 7.6);
      r.move(N[4], B[2] + 8.8, 0.5);

      // —— 第 4 句：9 < 10，排除 1 ——
      sum.set("1 + 8 = 9", B[3] + 0.3);
      sum.set('1 + 8 = 9 <span class="acc-b">&lt; 10</span>', B[3] + 1.7);
      code.hl(1, B[3] + 5.4);
      out(0, B[3] + 5.8);
      l.move(N[1], B[3] + 6.8, 0.5);

      // —— 第 5 句：继续三步 ——
      let t = B[4] + 0.4;
      sum.set('3 + 8 = 11 <span class="acc-o">&gt; 10</span>', t); code.hl(0, t + 0.5); out(4, t + 0.8); r.move(N[3], t + 1.2, 0.45);
      t = B[4] + 2.6;
      sum.set('3 + 6 = 9 <span class="acc-b">&lt; 10</span>', t); code.hl(1, t + 0.5); out(1, t + 0.8); l.move(N[2], t + 1.2, 0.45);
      t = B[4] + 4.8;
      sum.set('4 + 6 = <span class="acc">10</span>', t); code.hlOff(t + 0.2);
      N[2].fill("tealL", t + 0.5).pulse(t + 0.5); N[3].fill("tealL", t + 0.5).pulse(t + 0.5);

      // —— 第 6 句：同一类题 ——
      L.ft(src, { opacity: 1 }, { opacity: 0, duration: 0.3 }, B[5] + 0.3);
      L.src("LeetCode 167 · 344 · 125 · 11", B[5] + 0.6);
      code.leave(B[5] + 0.4);

      L.done();
      window.__timelines = window.__timelines || {};
      window.__timelines["s03"] = tl;
    })();
  </script>
</template>
