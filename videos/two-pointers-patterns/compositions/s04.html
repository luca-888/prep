<template>
  <style>
    #root { position: absolute; inset: 0; }
  </style>
  <!-- s04 三数之和（LeetCode 15）：排序 → 固定第一个数，右边找两个数 → 右边对撞 → 第一个数右移，再对撞，得到两组 → 相同的数跳过 -->
  <div id="root" data-composition-id="s04" data-width="1920" data-height="1080">
    <div id="s04-stage" style="position: absolute; inset: 0"></div>
  </div>
  <script>
    (function () {
      const { B, dur: DUR } = BEATS.s04;
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const L = LL(document.getElementById("s04-stage"), tl, DUR);
      const X = (i) => 960 + (i - 2.5) * 146;       // 六个格子相连，边框重叠 4 px

      L.header("手法 2", "排序后固定一个数");
      const src = L.src("LeetCode 15 · 三数之和为 0", B[0] + 0.6);
      const Y = 320;
      // 未排序 [-1, 0, 1, 2, -1, -4]；TO[k] 是第 k 个格子排序后的位置
      const RAW = [-1, 0, 1, 2, -1, -4], TO = [1, 3, 4, 5, 2, 0];
      const R = RAW.map((v, i) => L.node(v, X(i), Y, { fs: 50 }));
      const S = []; TO.forEach((p, k) => { S[p] = R[k]; });   // S：按排序后的位置取格子

      // —— 第 1 句：排序 ——
      R.forEach((n, i) => n.show(0.02 + i * 0.08));
      R.forEach((n, k) => {
        const t = B[0] + 2.3, up = k % 2 ? -1 : 1;
        n.z(k === 5 || k === 4 ? 3 : 1, t);
        n.x.to(X(TO[k]), t, 1.3);
        n.y.to(Y + up * 95, t, 0.65, "power1.out"); n.y.to(Y, t + 0.65, 0.65, "power1.in");
      });

      // —— 第 2 句：固定第一个数；右边一段 ——
      const pi = L.tag("i", "purple", S[0], { side: -1 }).show(B[1] + 0.6);
      const br = L.div(L.stage, "position:absolute;left:0;top:0;height:18px;border:5px solid var(--hot);border-bottom:none;border-radius:3px 3px 0 0;opacity:0");
      const bl = L.track(X(1) - 73), bo = L.track(0);
      L.custom((t) => {
        const x = bl.at(t);
        br.style.opacity = bo.at(t);
        br.style.width = Math.max(0, X(5) + 73 - x) + "px";
        br.style.transform = `translate(${x}px,${Y - 92}px)`;
      });
      bo.to(1, B[1] + 2.0, 0.4);
      const msg = L.swap(610, "font-family:var(--zh);font-size:52px");
      msg.set('右边两个数的和 = <span class="acc-p">4</span>', B[1] + 3.6);

      // —— 第 3 句：右边对撞，没有找到 ——
      const l = L.tag("l", "blue", S[1]).show(B[2] + 2.4);
      const r = L.tag("r", "hot", S[5]).show(B[2] + 2.8);
      [2, 3, 4].forEach((i, k) => l.move(S[i], B[2] + 3.5 + k * 0.6, 0.4));
      msg.set("没有这样的两个数", B[2] + 5.4);
      l.hide(B[2] + 6.2); r.hide(B[2] + 6.2);

      // —— 第 4 句：i 右移，再对撞，得到两组 ——
      pi.move(S[1], B[3] + 0.4, 0.5); bl.to(X(2) - 73, B[3] + 0.4, 0.5);
      msg.set('右边两个数的和 = <span class="acc-p">1</span>', B[3] + 1.0);
      l.move(S[2], B[3] + 0.5, 0.01).show(B[3] + 1.6); r.show(B[3] + 1.7);
      const ans = ["[-1, -1, 2]", "[-1, 0, 1]"].map((s, i) => {
        const e = L.div(L.ui, `position:absolute;left:${560 + i * 420}px;top:740px;width:380px;text-align:center;padding:8px 0 10px;background:#b0e0d8;border-radius:4px;font-family:var(--mono);font-size:44px;font-weight:800;color:var(--ink);white-space:nowrap`, s);
        gsap.set(e, { opacity: 0 });
        return e;
      });
      const hit = (i, t) => L.ft(ans[i], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, t);
      [1, 2, 5].forEach((i) => S[i].fill("tealL", B[3] + 2.6));
      hit(0, B[3] + 2.9);
      [2, 5].forEach((i) => S[i].fill("white", B[3] + 4.0));
      l.move(S[3], B[3] + 4.1, 0.45); r.move(S[4], B[3] + 4.1, 0.45);
      [3, 4].forEach((i) => S[i].fill("tealL", B[3] + 4.9));
      hit(1, B[3] + 5.2);
      [1, 3, 4].forEach((i) => S[i].fill("white", B[3] + 6.3));
      l.hide(B[3] + 6.3); r.hide(B[3] + 6.3);

      // —— 第 5 句：相同的数相邻，跳过 ——
      msg.hide(B[4] + 0.2);
      S[1].pulse(B[4] + 1.6, 1.1); S[2].pulse(B[4] + 1.8, 1.1);
      pi.move(S[2], B[4] + 4.2, 0.5); bl.to(X(3) - 73, B[4] + 4.2, 0.5);
      S[2].fill("grayL", B[4] + 5.0).border("gray", B[4] + 5.0);
      const dup = L.label("与前一个相同", X(2), Y + 110, "background:var(--hot);color:#fff;font-size:34px;font-weight:800;padding:4px 16px 6px;border-radius:3px");
      dup.show(B[4] + 5.2); dup.hide(B[4] + 7.2);
      pi.move(S[3], B[4] + 7.3, 0.5); bl.to(X(4) - 73, B[4] + 7.3, 0.5);
      S[2].fill("white", B[4] + 7.8).border("ink", B[4] + 7.8);

      // —— 第 6 句 ——
      L.ft(src, { opacity: 1 }, { opacity: 0, duration: 0.3 }, B[5] + 0.3);
      L.src("LeetCode 15 · 16 · 18", B[5] + 0.6);

      L.done();
      window.__timelines = window.__timelines || {};
      window.__timelines["s04"] = tl;
    })();
  </script>
</template>
