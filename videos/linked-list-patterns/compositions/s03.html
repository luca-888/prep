<template>
  <style>
    #root { position: absolute; inset: 0; }
  </style>
  <!-- s03 哑节点：头节点没有前驱（问号空位）→ 多出一个分支 → dummy 补上空位、分支划掉 → 同一段循环走完 → 返回 dummy.next -->
  <div id="root" data-composition-id="s03" data-width="1920" data-height="1080">
    <div id="s03-stage" style="position: absolute; inset: 0"></div>
  </div>
  <script>
    (function () {
      const { B, dur: DUR } = BEATS.s03;
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const L = LL(document.getElementById("s03-stage"), tl, DUR);

      L.header("手法 1", "哑节点：消除头节点的特例");
      const src = L.src("LeetCode 203 · 删除值为 6 的节点", B[0] + 0.6);
      const Y = 300, DX = 330, X = [580, 830, 1080, 1330];
      const N = [6, 1, 6, 2].map((v, i) => L.node(v, X[i], Y));
      const NONE = L.node("None", 1545, Y, { kind: "none" });
      const A = N.map((n, i) => L.arrow(n, i < 3 ? N[i + 1] : NONE));
      const Q = L.node("?", DX, Y, { kind: "dummy", fs: 54 });
      const D = L.node("dummy", DX, Y, { kind: "dummy" });
      const AD = L.arrow(D, N[0]);

      // —— 第 1 句：6 标橙；prev 落在第二个 6 的前一个节点，再移到头节点左侧的空位 ——
      N.forEach((n, i) => { n.show(0.02 + i * 0.1); A[i].draw(0.25 + i * 0.1); });
      NONE.show(0.6);
      const head = L.tag("head", "ink", N[0], { side: -1 }).show(B[0] + 0.9);
      N[0].fill("hotL", B[0] + 1.2); N[2].fill("hotL", B[0] + 1.3);
      const prev = L.tag("prev", "blue", N[1]).show(B[0] + 1.9);
      A[1].flash("blue", B[0] + 2.2, 0.8);
      Q.show(B[0] + 3.9).border("red", B[0] + 3.9, 0.01);
      prev.move(Q, B[0] + 4.1, 0.7);

      // —— 第 2 句：专门处理头节点的两行 ——
      const cS = L.code(["while head and head.val == val:", "    head = head.next"], { y: 600, w: 800 });
      cS.show(B[1] + 0.5).line(0, B[1] + 0.6).line(1, B[1] + 0.9);
      N[0].pulse(B[1] + 2.4, 1.08);

      // —— 第 3 句：dummy 补上空位；那两行被划掉；每个节点都有前驱 ——
      Q.hide(B[2] + 0.2);
      D.show(B[2] + 1.0);
      AD.draw(B[2] + 1.6, 0.5);
      const strike = L.div(cS.el, "position:absolute;left:30px;top:0;width:720px;height:100%;pointer-events:none");
      strike.setAttribute("data-layout-allow-occlusion", "");
      [0, 1].forEach((i) => {
        const s = L.div(strike, `position:absolute;left:0;top:${L.PAD + i * L.LH + 28}px;width:${i ? 456 : 707}px;height:5px;background:var(--red);transform-origin:0 50%`);
        gsap.set(s, { scaleX: 0 });
        L.ft(s, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, B[2] + 3.0 + i * 0.25);
      });
      cS.leave(B[2] + 4.2);
      [AD, A[0], A[1], A[2]].forEach((a, i) => a.flash("blue", B[2] + 4.4 + i * 0.3, 0.35));

      // —— 第 4 句：prev 从 dummy 出发，同一段循环 ——
      const cM = L.code(["while prev.next:", "    if prev.next.val == val:", "        prev.next = prev.next.next", "    else:", "        prev = prev.next"], { y: 545, w: 880 });
      cM.show(B[3] + 0.2).line([0, 1, 2, 3, 4], B[3] + 0.3);
      head.hide(B[3] + 0.3);
      const ts = B[3] + 1.5, ST = 1.55;
      // 1) prev.next 是 6：绕过
      cM.hl(1, ts).hl(2, ts + 0.45);
      AD.color("hot", ts + 0.5).retarget(N[1], ts + 0.55, 0.6, 100);
      N[0].move(null, Y + 160, ts + 0.9, 0.6, "power2.in").hide(ts + 0.95, 0.45);
      AD.color("ink", ts + 1.15, 0.3).arc(0, ts + 1.2, 0.35);
      // 2) prev.next 是 1：前进
      cM.hl(1, ts + ST).hl(4, ts + ST + 0.45);
      prev.move(N[1], ts + ST + 0.5, 0.55);
      // 3) prev.next 是 6：绕过
      cM.hl(1, ts + 2 * ST).hl(2, ts + 2 * ST + 0.45);
      A[1].color("hot", ts + 2 * ST + 0.5).retarget(N[3], ts + 2 * ST + 0.55, 0.6, 100);
      N[2].move(null, Y + 160, ts + 2 * ST + 0.9, 0.6, "power2.in").hide(ts + 2 * ST + 0.95, 0.45);
      A[1].color("ink", ts + 2 * ST + 1.15, 0.3).arc(0, ts + 2 * ST + 1.2, 0.35);
      // 4) prev.next 是 2：前进
      cM.hl(1, ts + 3 * ST).hl(4, ts + 3 * ST + 0.45);
      prev.move(N[3], ts + 3 * ST + 0.5, 0.55);
      // 5) prev.next 为 None：循环结束
      cM.hl(0, ts + 4 * ST).hlOff(ts + 4 * ST + 0.7);

      // —— 第 5 句：返回 dummy.next ——
      cM.leave(B[4] + 0.1); prev.hide(B[4] + 0.1);
      const cR = L.code(["return dummy.next"], { y: 620, w: 500 });
      cR.show(B[4] + 0.4).line(0, B[4] + 0.5);
      AD.flash("teal", B[4] + 1.2, 0.8);
      const head2 = L.tag("head", "ink", N[1], { side: -1 }).show(B[4] + 1.5);
      N[1].fill("tealL", B[4] + 1.5);
      D.dim(0.4, B[4] + 2.0);

      // —— 第 6 句：题号换成 21，dummy 重新亮起 ——
      const src2 = L.src("LeetCode 21 · 合并两个有序链表", B[5] + 0.5);
      L.ft(src, { opacity: 1 }, { opacity: 0, duration: 0.3 }, B[5] + 0.2);
      D.dim(1, B[5] + 0.8).border("teal", B[5] + 0.9).pulse(B[5] + 1.6, 1.12);
      N[1].fill("white", B[5] + 0.8);
      cR.leave(B[5] + 0.8);

      L.done();
      window.__timelines = window.__timelines || {};
      window.__timelines["s03"] = tl;
    })();
  </script>
</template>
