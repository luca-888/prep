<template>
  <style>
    #root { position: absolute; inset: 0; }
  </style>
  <!-- s02 改一根指针（标签在节点上方，绕行的箭头从下方走）：删除（箭头绕过节点）→ 插入的错误顺序（后半段丢失）→ 正确顺序 → “先保存，再修改” -->
  <div id="root" data-composition-id="s02" data-width="1920" data-height="1080">
    <div id="s02-stage" style="position: absolute; inset: 0"></div>
  </div>
  <script>
    (function () {
      const { B, dur: DUR } = BEATS.s02;
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const L = LL(document.getElementById("s02-stage"), tl, DUR);

      L.header("基本动作", "改一根指针");
      const Y = 350, X = [570, 830, 1090, 1350];
      const N = [1, 2, 3, 4].map((v, i) => L.node(v, X[i], Y));
      const NONE = L.node("None", 1575, Y, { kind: "none" });
      const A = N.map((n, i) => L.arrow(n, i < 3 ? N[i + 1] : NONE));

      // —— 第 1 句：链表出现，箭头依次闪亮 ——
      N.forEach((n, i) => { n.show(0.02 + i * 0.1); A[i].draw(0.25 + i * 0.1); });
      NONE.show(0.6);
      A.forEach((a, i) => a.flash("teal", B[0] + 2.2 + i * 0.4, 0.4));

      // —— 第 2 句：删除 3 —— prev 的箭头拱起绕过 cur，cur 落下，后面靠拢 ——
      const prev = L.tag("prev", "blue", N[1], { side: -1 }).show(B[1] + 0.9);
      const cur = L.tag("cur", "teal", N[2], { side: -1 }).show(B[1] + 0.5);
      N[2].fill("hotL", B[1] + 0.5);
      const cA = L.code(["prev.next = cur.next"], { x: 150, y: 720, w: 540 });
      cA.show(B[1] + 2.4).line(0, B[1] + 2.5).hl(0, B[1] + 2.9);
      A[1].color("hot", B[1] + 3.1).retarget(N[3], B[1] + 3.2, 0.9, -100);
      A[1].color("ink", B[1] + 4.4, 0.4);
      cur.hide(B[1] + 4.8);
      N[2].move(null, Y - 170, B[1] + 4.9, 0.7, "power2.in").hide(B[1] + 5.0, 0.5);
      N[3].move(X[2], null, B[1] + 5.8, 0.8);
      NONE.move(1315, null, B[1] + 5.8, 0.8);
      A[1].arc(0, B[1] + 5.8, 0.8);
      cA.leave(B[2] - 0.2);

      // —— 第 3 句：新节点出现在下方；要改的箭头闪亮 ——
      const NEW = L.node(5, 960, 545).show(B[2] + 0.5);
      NEW.fill("tealL", B[2] + 0.5, 0.01);
      const tnew = L.tag("new", "purple", NEW).show(B[2] + 0.8);
      const AN = L.arrow(NEW, N[3]);
      A[1].flash("hot", B[2] + 2.3, 0.7);

      // —— 第 4 句：错误顺序 —— prev.next 先指向新节点，后半段没有指针指向它 ——
      const cW = L.code(["prev.next = new"], { x: 150, y: 720, w: 440 });
      cW.show(B[3] + 0.3).line(0, B[3] + 0.4);
      L.ft(cW.lines[0], { color: "#3a3a3a" }, { color: "#e5322d", duration: 0.2 }, B[3] + 0.8);
      A[1].color("red", B[3] + 1.6).retarget(NEW, B[3] + 1.7, 0.8);
      const lostT = B[3] + 3.3;
      N[3].fill("grayL", lostT).border("gray", lostT).dim(0.45, lostT + 0.01, 0.6).move(X[2] + 70, Y - 50, lostT + 0.02, 1.4, "power1.out");
      NONE.dim(0.45, lostT, 0.6).move(1315 + 70, Y - 50, lostT + 0.02, 1.4, "power1.out");
      const lost = L.label("丢失", 1300, Y - 170, "background:var(--red);color:#fff;font-size:36px;font-weight:800;padding:4px 16px 6px;border-radius:3px");
      lost.show(lostT + 0.9);
      // 恢复原状
      const back = B[3] + 6.6;
      lost.hide(back); cW.leave(back);
      N[3].fill("white", back).border("ink", back).dim(1, back + 0.01, 0.5).move(X[2], Y, back + 0.02, 0.7);
      NONE.dim(1, back, 0.5).move(1315, Y, back + 0.02, 0.7);
      A[1].color("ink", back, 0.3).retarget(N[3], back + 0.3, 0.7);

      // —— 第 5 句：正确顺序 —— 新节点先接后半段，prev 再接新节点；新节点升入行内 ——
      const cR = L.code(["new.next = prev.next", "prev.next = new"], { x: 150, y: 720, w: 540 });
      cR.show(B[4] + 0.2).line(0, B[4] + 0.3).hl(0, B[4] + 0.9);
      AN.color("use", B[4] + 1.2, 0.01).draw(B[4] + 1.3, 0.6).color("ink", B[4] + 2.4, 0.4);
      cR.line(1, B[4] + 3.2).hl(1, B[4] + 3.5);
      A[1].color("use", B[4] + 3.8).retarget(NEW, B[4] + 3.9, 0.8).color("ink", B[4] + 4.9, 0.4);
      tnew.hide(B[4] + 5.1);
      const RX = [500, 760, 1020, 1280, 1505], rt = B[4] + 5.3;
      N[0].move(RX[0], null, rt, 0.9); N[1].move(RX[1], null, rt, 0.9);
      NEW.move(RX[2], Y, rt, 0.9).fill("white", rt + 0.9, 0.4);
      N[3].move(RX[3], null, rt, 0.9); NONE.move(RX[4], null, rt, 0.9);

      // —— 第 6 句：箭头依次闪亮，“先保存，再修改” ——
      cR.leave(B[5] + 0.1); prev.hide(B[5] + 0.1);
      [A[0], A[1], AN, A[3]].forEach((a, i) => a.flash("teal", B[5] + 0.7 + i * 0.35, 0.4));
      L.key('先<span class="acc">保存</span>，再<span class="acc-o">修改</span>', 680, B[5] + 3.0);

      L.done();
      window.__timelines = window.__timelines || {};
      window.__timelines["s02"] = tl;
    })();
  </script>
</template>
